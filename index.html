<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Mess bazar, meal &amp; expense tracker">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-emoji">🍽️</span><span>Mess Hisab</span></div>
    <nav class="nav">
      <a href="#/dashboard" class="nav-item" data-route="dashboard"><span class="nav-icon">🏠</span>Dashboard</a>
      <a href="#/members" class="nav-item" data-route="members"><span class="nav-icon">👥</span>Members</a>
      <a href="#/costs" class="nav-item" data-route="costs"><span class="nav-icon">🛒</span>Bazar &amp; Costs</a>

    </nav>
    <div class="sidebar-footer">Free &amp; open · GitHub Pages</div>

  <div class="main-col">

      <button class="icon-btn only-mobile" id="menuToggle" title="Menu">☰</button>

      <div class="topbar-actions">

        <button class="icon-btn" id="addMonthBtn" title="Add month">➕</button>
        <button class="icon-btn" id="themeToggle" title="Toggle theme">🌓</button>

  </div>

  <nav class="bottom-nav">
    <a href="#/dashboard" class="nav-item" data-route="dashboard"><span class="nav-icon">🏠</span><span>Home</span></a>

  </nav>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
